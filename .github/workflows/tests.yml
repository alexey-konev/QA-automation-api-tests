name: tests

on:
  push:
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    env:
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements.txt

      - run: playwright install

      - run: python -m pytest tests/ui

  api-db-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qa_api_db
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements.txt

      - run: |
          PGPASSWORD=${{ secrets.DB_PASSWORD }} psql \
            -h localhost \
            -U ${{ secrets.DB_USER }} \
            -d qa_api_db \
            -f sql/init.sql

      - run: uvicorn app.app:app --host 0.0.0.0 --port 8000 &

      - run: |
          for i in {1..10}; do
            curl --fail http://localhost:8000/ && break
            sleep 1
          done
          
      - run: python -m pytest tests/api tests/db
