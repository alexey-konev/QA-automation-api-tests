name: tests

on:
  push:
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    env:
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements.txt

      - run: playwright install

      - run: python -m pytest tests/ui --alluredir=allure-results-ui

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-ui
          path: allure-results-ui

  api-db-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qa_api_db
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements.txt

      - run: |
          psql \
            -h localhost \
            -U "$POSTGRES_USER" \
            -d qa_api_db \
            -f sql/init.sql
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}

      - run: uvicorn app.app:app --host 0.0.0.0 --port 8000 &

      - run: |
          for i in {1..10}; do
            curl --fail http://localhost:8000/ && break
            sleep 1
          done
          
      - run: python -m pytest tests/api tests/db --alluredir=allure-results-api-db

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-api-db
          path: allure-results-api-db
